    - paragraph [ref=f2e72]: Double‑tap the right ⌘ and a pixel office grows out of the notch. Working agents type at their iMacs, and each screen shows what they’re doing — code, terminal or browser. The one who needs you stands up, and the ones who are done go for coffee.
