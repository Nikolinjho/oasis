  - generic [ref=f2e124]:
    - paragraph [ref=f2e128]: Everything stays on your Mac.
    - paragraph [ref=f2e129]: No accounts, no tracking. No Screen Recording permission; Accessibility only if you turn on sending Claude replies from the notch. Lumio reads your agents’ local files — and nothing goes to the network unless you turn it on. The daily update check only tells us that one more Mac uses Lumio — by a random number, nothing about you.
