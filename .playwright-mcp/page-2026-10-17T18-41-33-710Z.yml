  - paragraph [ref=f2e39]: You run three agents at once. One is done. One is waiting for your “yes”. One crashed ten minutes ago. And you find out only when you switch windows.
  - generic [ref=f2e41]:
    - paragraph [ref=f2e42]: The notch
    - heading "It calls when it needs you." [level=2] [ref=f2e43]
    - paragraph [ref=f2e44]: When an agent asks for permission or a question, the notch glows in its color — warm for Claude, icy for Codex — and a dot appears in the menu bar. Approve the command or pick an answer right in the notch — no window switching.
  - generic [ref=f2e48]:
    - paragraph [ref=f2e49]: Stay awake
    - heading "Step away. Let your agents finish." [level=2] [ref=f2e50]: Step away.Let your agents finish.
    - paragraph [ref=f2e51]: Your Mac stays awake while your agents work. The display can turn off — sessions keep going. Just keep the lid open. A timer gives you control.
