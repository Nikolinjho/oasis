  - paragraph [ref=f20e90]: Вариант 480 × 352 и постоянная дополнительная полоса из v2 сняты. Для длинного вопроса прокручивается содержимое экрана, действия остаются видны. HTML показывает приближение формы острова. В приложении используется существующий IslandShape с его squircle и анимациями.